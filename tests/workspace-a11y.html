<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Workspace accessibility checks</title></head><body><h1>Workspace accessibility checks</h1><pre id="report">Running…</pre><iframe title="Test app" id="app" style="height:1100px;border:0"></iframe><script type="module">
const frame=document.querySelector('#app'),report=document.querySelector('#report'),lines=[];for(const width of [320,1440])for(const id of ['merge-pdf','resize-image','json-formatter','percentage','qr-generator','focus-timer','notes','audio-trim','video-frame']){frame.style.width=width+'px';await new Promise(r=>{frame.onload=r;frame.src='/tools/'+id;});await new Promise(r=>setTimeout(r,150));const d=frame.contentDocument,s=d.createElement('script');s.src='/node_modules/axe-core/axe.min.js';await new Promise(r=>{s.onload=r;d.head.appendChild(s);});const result=await frame.contentWindow.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}});lines.push(JSON.stringify({width,id,overflow:d.documentElement.scrollWidth>width,violations:result.violations.map(v=>({id:v.id,nodes:v.nodes.map(n=>n.target)}))}));report.textContent=lines.join('\n');}document.title='Complete — Workspace checks';
</script></body></html>
