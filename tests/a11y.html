<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Daykit accessibility verification</title></head><body><h1>Accessibility and responsive checks</h1><pre id="report">Running…</pre><iframe title="Test app" id="app" style="height:1000px;border:0"></iframe><script type="module">
const frame=document.querySelector('#app'),report=document.querySelector('#report');const lines=[];
for(const width of [320,768,1024,1440]){frame.style.width=width+'px';await new Promise(r=>{frame.onload=r;frame.src='/?test='+width;});await new Promise(r=>setTimeout(r,300));const d=frame.contentDocument;const script=d.createElement('script');script.src='/node_modules/axe-core/axe.min.js';await new Promise(r=>{script.onload=r;d.head.appendChild(script);});const result=await frame.contentWindow.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}});lines.push(JSON.stringify({width,overflow:d.documentElement.scrollWidth>width,offenders:Array.from(d.querySelectorAll('main,header,footer,section,h1,h2,.section-heading,.hero-art')).filter(e=>e.getBoundingClientRect().right>width).map(e=>({tag:e.tagName,cls:e.className,right:e.getBoundingClientRect().right})),violations:result.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))}))}));report.textContent=lines.join('\n\n');}
document.title='Complete — Daykit accessibility';
</script></body></html>
