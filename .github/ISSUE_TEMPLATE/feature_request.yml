name: Suggest a Daykit tool
description: Tell us which everyday task Daykit should simplify next.
title: "Tool idea: "
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What task should Daykit help with?
      description: Describe the input, result, and why this task matters to you.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How do you do it today?
      description: Share the tools or workaround you currently use. Please do not include private files.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include confidential or personal data in this issue.
          required: true
